    ["Wobbly Waffle","🧇","#B565D8","#9a62b8",false,5,0,0,0,0,1],

  (function(){ const adj=["Happy","Sunny","Tiny","Giant","Cosy","Funky","Lucky","Spicy","Sleepy","Jolly","Fancy","Wild","Silly","Super","Mega","Dizzy","Zesty","Mighty"],

    for(let i=0;i<62;i++){ let nm; do{ nm=adj[(Math.random()*adj.length)|0]+" "+noun[(Math.random()*noun.length)|0]; }while(used.has(nm)); used.add(nm);

        c:{seats,space,sink:(Math.random()*4)|0,worker:(Math.random()*3)|0,cleaner:(Math.random()*3)|0,waiters:1+((Math.random()*3)|0),floors}}); } })();
  const TOWN_W=TOWN_INIT.length*156+40, TOWN_CX=TOWN_W/2, TOWN_PX=316;
  const TOWN_SECRETS=[{p:330,x:-0.95,to:"S:4:1",dw:0},{p:1110,x:0.95,to:"S:5:1",dw:0},{p:1890,x:-0.95,to:"S:6:1",dw:0}];
  const HOUSES=Array.from({length:Math.floor((TOWN_INIT.length+1)/2)-1},(_,k)=>({k,d:330+260*k,side:k%2===0?1:-1,spots:null,lootT:0,name:"House "+(k+1)}));
  const TOWN_D=i=>200+Math.floor(i/2)*260, TOWN_MAXP=TOWN_D(TOWN_INIT.length-1)+160;
  let town=[], dlg=null, cafeName="Coony's Café & Hotel", talkCool={};

  function ratingOf(c){ return Math.max(1,Math.min(10,Math.round(1+Math.min(3,c.seats*0.25)+Math.min(2,c.space*0.5)+c.sink*1.1+Math.min(1.5,(c.worker||0)*0.75)+Math.min(1.5,(c.cleaner||0)*0.75)+Math.min(1,((c.waiters||1)-1)*0.5)+Math.min(2,(c.floors||0)*0.7)))); }

  // ---------- hiring ----------
  function newBuilder(x,z){ return { x, z, legPhase:0, walking:false, t:0 }; }
  function staffList(id){ return id==="worker"?workers:(id==="cleaner"?cleaners:(id==="builder"?builders:waiters)); }
  function staffNext(id){ return staffCost(id,staffList(id).length-(id==="waiter"?1:0)); }
  function hire(id){ const L=staffList(id), cost=staffNext(id);
    const nm={worker:"Plate worker",cleaner:"Cleaner",waiter:"Waiter",builder:"Builder"}[id], ic={worker:"🍽️",cleaner:"🧹",waiter:"🛎️",builder:"🔨"}[id], yy={worker:120,cleaner:150,waiter:180,builder:210}[id];
    if(L.length>=STAFF_MAX){ sfx.nope(); addPopup("You have the max "+nm+"s!", CENTER, yy, "#C0392B"); return; }
    if(money<cost){ sfx.nope(); addPopup("Need £"+cost+" first!", CENTER, yy, "#C0392B"); return; }
    money-=cost; const x=0.5+Math.random()*0.3;
    L.push(id==="worker"?newWorker(x,0.9):(id==="cleaner"?newCleaner(x,0.9):(id==="builder"?newBuilder(x,0.9):newWaiter(x,0.9))));
    sfx.buy(); addPopup(nm+" hired! "+ic+" Next one £"+(cost+20), CENTER, yy, "#2C8A3E"); }
  const cam={tx:0,ty:0,s:1}; let camSnap=true;
  function camOn(){ return scene==="inside"&&state==="playing"; }
  function camTarget(){ const G=gNow(), half=P.nearHW*G, fb=P.topY+(P.botY-P.topY)*G;
    if(camFull){ const s=Math.min(W/(2*half+20),(H-100)/fb); return { s, tx:W/2-CENTER*s, ty:Math.max(0,(H-100-fb*s)/2) }; }
    const cp=project(coony.x,coony.z), wb=fb+90;
    return { s:1, tx:Math.max(W/2-half,Math.min(half-W/2,W/2-cp.sx)), ty:Math.max(H-wb,Math.min(0,300-(cp.sy-50))) }; }
  function addPopupW(text,sx,sy,color){ if(camOn()){ sx=sx*cam.s+cam.tx; sy=sy*cam.s+cam.ty; } addPopup(text,sx,sy,color); }
  function addPopup(text,sx,sy,color){ popups.push({text,x:sx,y:sy,color:color||"#4A2E17",life:1.2,vy:-40}); }

  // ---------- spawning ----------
  const SHIRTS=["#E4572E","#4A90D9","#6BBF59","#F4C430","#B565D8","#EA7BB0","#2CB5A0","#F08A24"];
  const SKINS=["#F1C7A5","#E0AC69","#C68642","#8D5524","#FFDCB8"];
  const HATS=["#2C3E50","#C0392B","#16A085","#8E44AD","#D35400",null,null];
  function patienceMax(){ return 40; }
  function pickWant(){ return (Math.random()*FOODS.length)|0; }
  function freeSeat(){ for(const st of seats){ if(st.owned && !st.cust && !st.plate) return st; } return null; }
  function spawnCustomer(){ const st=freeSeat(); if(!st)return;
    const c={ x:-0.9, z:0.1, seat:st, tx:st.x, tz:st.z, state:"entering",
      patience:1,pMax:1, eat:0, want:0, serving:false, messTimer:3+Math.random()*4, legPhase:Math.random()*6, bob:Math.random()*6, walking:true,
      shirt:SHIRTS[(Math.random()*SHIRTS.length)|0], skin:SKINS[(Math.random()*SKINS.length)|0],
      hat:HATS[(Math.random()*HATS.length)|0], mood:"happy" };
    st.cust=c; customers.push(c); }
  function addMess(x,z){ if(mess.length>=10+Math.floor(seatsOwned/2))return; const kinds=["🍟","🍫"]; // chips & chocolate
    mess.push({x:Math.max(-0.9,Math.min(0.9,x)), z:Math.max(0.15,Math.min(0.9,z)), emoji:kinds[(Math.random()*kinds.length)|0], wob:Math.random()*6}); }

  // ---------- input ----------
  function keyName(k){ switch(k){
    case"ArrowLeft":case"a":case"A":return"left"; case"ArrowRight":case"d":case"D":return"right";
    case"ArrowUp":case"w":case"W":return"up"; case"ArrowDown":case"s":case"S":return"down"; } return null; }
  addEventListener("keydown",e=>{ if(e.key==="Escape") dlg=null; if(boss&&(e.key==="f"||e.key==="F")) bossSwat(null); const n=keyName(e.key); if(n){keys.add(n);e.preventDefault();}
    if(boss&&(e.key===" "||e.key==="Enter")){ bossTap(null); e.preventDefault(); return; }
    if((e.key===" "||e.key==="Enter")&&state==="title") startGame(); else if((e.key===" "||e.key==="Enter")&&state==="gameover") nextRound(); });
  addEventListener("keyup",e=>{ const n=keyName(e.key); if(n)keys.delete(n); });

  const DP={cx:120,cy:470};
  const dpad={ up:{x:DP.cx-24,y:DP.cy-56,w:48,h:34,dx:0,dz:-1,label:"▲"},
    down:{x:DP.cx-24,y:DP.cy+22,w:48,h:34,dx:0,dz:1,label:"▼"},
    left:{x:DP.cx-58,y:DP.cy-16,w:34,h:48,dx:-1,dz:0,label:"◀"},
    right:{x:DP.cx+24,y:DP.cy-16,w:34,h:48,dx:1,dz:0,label:"▶"} };
  const bigBtn={x:W/2-130,y:486,w:260,h:74}, muteBtn={x:W-54,y:12,w:42,h:32};

  function toDesign(e){ const r=canvas.getBoundingClientRect();
    const cx=e.touches?e.touches[0].clientX:e.clientX, cy=e.touches?e.touches[0].clientY:e.clientY;
    return { x:(cx-r.left)*(W/r.width), y:(cy-r.top)*(H/r.height) }; }
  const inR=(p,r)=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;

  function pointerDown(e){ e.preventDefault(); initAudio();
    if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume();
    const p=toDesign(e);
    if(inR(p,muteBtn)){ audioOn=!audioOn; sfx.click(); return; }
    if(state==="title"||state==="gameover"){ if(inR(p,bigBtn)){sfx.click(); if(state==="title")startGame(); else nextRound();} return; }
    if(dlg){ dlgTap(p); return; }
    if(boss){ bossTap(p); return; }
    if(scene==="town"){ if(placesOpen){ placesOpen=false; for(const r of placeRects) if(inR(p,r)){ townP=Math.max(0,r.b.d-130); coony.x=0; sfx.door(); } sfx.click(); return; }
      if(inR(p,placesBtn)){ placesOpen=true; sfx.click(); return; } }
    if(scene==="inside"||scene==="outside"){
      for(const [id,b] of [["worker",hireBtn],["cleaner",cleanerBtn],["waiter",waiterBtn],["builder",builderBtn]]) if(inR(p,b)){ hire(id); return; } }
    if(scene==="inside"&&floorLvl>=1&&inR(p,stairBtn)){ sfx.click(); roomDoorX=0.9; enterRoom("up:1","inside"); return; }
    if(scene==="inside"&&inR(p,camBtn)){ camFull=!camFull; sfx.click(); return; }
    for(const k in dpad){ if(inR(p,dpad[k])){ heldDir={dx:dpad[k].dx,dz:dpad[k].dz}; return; } }
    if(scene==="rival"){ sabotageTap(p); return; }
    for(const b of botBtns){ if(inR(p,b)){ bottomTap(b.id); return; } }
  }
  function bottomTap(id){
    const msgY=barY-30;
    if(id==="food"){ const pack=FOOD_PACK*(1+spaceLvl);
      if(money>=PRICE){ money-=PRICE; foodStock+=pack; sfx.buy(); addPopup("+"+pack+" food 🍔", W/2, msgY, "#2C8A3E"); }
      else { sfx.nope(); addPopup("Need more money!", W/2, msgY, "#C0392B"); }
    } else if(id==="floor") buyFloor();
    else if(id==="seat"||id==="space"||id==="sink") buyUpgrade(id);
  }
  function buyFloor(){ const msgY=barY-30;
    if(floorLvl>=MAX_FLOORS){ sfx.nope(); addPopup("You have all "+(MAX_FLOORS+1)+" floors!", W/2, msgY, "#C0392B"); return; }
    if(money<FLOOR_COST){ sfx.nope(); addPopup("Need £"+FLOOR_COST+" for a new floor", W/2, msgY, "#C0392B"); return; }
    money-=FLOOR_COST; floorLvl++; layoutSeats(); camSnap=true; sfx.win(); addPopup("🏢 NEW FLOOR! Take the stairs ⬆️ (back wall, right)", CENTER, 240, "#34495e"); }
  function buyUpgrade(id){
    const cap=capNow(), msgY=barY-30;
    if(id==="seat"){
      if(seatsOwned>=maxSeatsNow()){ sfx.nope(); addPopup("All "+maxSeatsNow()+" seats bought!", W/2, msgY, "#C0392B"); return; }
      if(seatsOwned>=cap){ sfx.nope(); addPopup("Buy a bigger room first! 🏠", W/2, msgY, "#C0392B"); return; }
      const cost=seatCost(seatsOwned);
      if(money>=cost){ money-=cost; seats[seatsOwned].owned=true; seatsOwned++; sfx.buy(); addPopup("New seat! 💺", W/2, msgY, "#2C8A3E"); }
      else { sfx.nope(); addPopup("Need £"+cost+" for a seat", W/2, msgY, "#C0392B"); }
    } else if(id==="space"){
      if(spaceLvl>=MAX_SPACE){ sfx.nope(); addPopup("Your café is already HUGE!", W/2, msgY, "#C0392B"); return; }
      const cost=SPACE_COSTS[spaceLvl];
      if(money>=cost){ money-=cost; spaceLvl++; sfx.buy(); addPopup("Bigger café! 🏠 Room for "+capNow()+" seats", W/2, msgY, "#2C8A3E"); }
      else { sfx.nope(); addPopup("Need £"+cost+" for more room", W/2, msgY, "#C0392B"); }
    } else if(id==="sink"){
      if(sinkLvl>=3){ sfx.nope(); addPopup("Sink is at max speed!", W/2, msgY, "#C0392B"); return; }
      const cost=SINK_COSTS[sinkLvl];
      if(money>=cost){ money-=cost; sinkLvl++; sfx.buy(); addPopup("Faster sink! 🧽", W/2, msgY, "#2C8A3E"); }
      else { sfx.nope(); addPopup("Need £"+cost+" for a faster sink", W/2, msgY, "#C0392B"); }
    }
  }

  // ---------- sabotage ----------
  const sabBtns=[{id:"dump",x:14,y:barY+4,w:200,h:barH-8},{id:"spoil",x:224,y:barY+4,w:200,h:barH-8},{id:"fart",x:434,y:barY+4,w:200,h:barH-8}];
  function sabotageTap(p){ for(const b of sabBtns) if(inR(p,b)){ sfx.click();
    if(b.id==="dump")doDump(); else if(b.id==="spoil")doSpoil(); else doFart(); return; } }
  function doDump(){
    if(trashBag<=0){ sfx.nope(); addPopup("Sweep up some trash first!", CENTER, 200, "#C0392B"); return; }
    const n=trashBag; rivalCount=Math.max(0,rivalCount-n); rivalSpoil=Math.max(rivalSpoil,5);
    for(let i=0;i<Math.min(n,10);i++) rmess.push({x:Math.random()*1.6-0.8, z:0.2+Math.random()*0.7, emoji:["🍟","🍫","🗑️","🍌"][(Math.random()*4)|0], life:25});
    while(rmess.length>16) rmess.shift();
    trashBag=0; sfx.dump(); addPopup("Dumped "+n+" trash on them! 😼", CENTER, 200, "#2C8A3E");
  }
  function doSpoil(){

    rivalSpoil=Math.max(rivalSpoil,15); spoilCd=8; for(const c of rcust) c.serve=0;
    sfx.dump(); addPopup("🤢 Their food is spoiled!", CENTER, 200, "#6a8f1a");

  function doFart(){
    if(fartsLeft<=0){ sfx.nope(); addPopup("No farts left!", CENTER, 200, "#C0392B"); return; }
    fartsLeft--; sfx.fart(); clouds.push({x:coony.x,z:coony.z,life:3}); rivalSmelly=20;
    addPopup("💨 PFFFT! "+fartsLeft+" left", CENTER, 200, "#6a8f1a");
    for(const c of rcust){ if(c.state==="leaving")continue;
      if(Math.hypot(c.x-coony.x,c.z-coony.z)<0.6){ c.state="leaving"; c.mood="sick"; c.walking=true; c.tx=-0.95; c.tz=0.08; } }
  }
  function pointerUp(){ heldDir=null; }
  canvas.addEventListener("mousedown",pointerDown);
  canvas.addEventListener("touchstart",pointerDown,{passive:false});
  addEventListener("mouseup",pointerUp); canvas.addEventListener("touchend",pointerUp);
  canvas.addEventListener("contextmenu",e=>e.preventDefault());

  // ---------- update ----------
  function update(dt){
    if(fade>0) fade=Math.max(0,fade-dt*2);
    if(tooMessyFlash>0) tooMessyFlash=Math.max(0,tooMessyFlash-dt);
    if(noFoodFlash>0) noFoodFlash=Math.max(0,noFoodFlash-dt);
    for(const p of popups){ p.life-=dt; p.y+=p.vy*dt; }
    popups=popups.filter(p=>p.life>0);
    for(const mm of mess) mm.wob+=dt*4;
    const mdt=dt/Math.sqrt(Math.max(1,GS[spaceLvl]*(1+0.25*floorLvl)/1.6));
    if(boss&&state==="playing"){ boss.pop=Math.max(0,boss.pop-dt*6); boss.flash=Math.max(0,boss.flash-dt*3); if(boss.phase==="fight") bossFx(dt); if(boss&&boss.phase==="fight"&&boss.mg) mgUpdate(dt*(boss.slow>0?0.55:1)); if(boss&&boss.phase==="fight"&&!boss.mg){ boss.shuffleT-=dt; if(boss.shuffleT<=0) bossShuffle();
      if(boss.rival){ boss.rival.t+=dt; while(boss&&boss.phase==="fight"&&boss.rival.t>=boss.rival.rate){ boss.rival.t-=boss.rival.rate; boss.rival.taps++; if(boss.rival.taps>=BOSS_NEED){ endDuel(false); break; } } } } }
    if(state==="playing"&&!boss){ let rate=0; for(let f=1;f<=5;f++) if(upStaff[f]>0&&!(scene==="room"&&roomId==="up:"+f)) rate+=upStaff[f]*0.5; if(rate>0){ upAcc+=rate*dt; if(upAcc>=6){ const g=Math.floor(upAcc/6)*6; upAcc-=g; money+=g; } } }
    if(state==="playing"&&!boss&&bankBal>0){ bankT+=dt; if(bankT>=20){ bankT=0; const g=Math.max(1,Math.round(bankBal*0.05)); bankBal+=g; addPopup("🏦 Bank interest +£"+g,CENTER,170,"#2C8A3E"); } }
    if(state==="playing"&&!dlg&&!boss&&floorLvl>=1){ if(upFreeze>0) upFreeze-=dt; else { upTimer+=dt; if(upTimer>=20){ upTimer=0; const gain=floorLvl*40; money+=gain; addPopup("🏢 Upstairs paid +£"+gain, CENTER, 150, "#2C8A3E"); } } }
    if(state!=="playing"||dlg||boss) return;
    if(scene==="inside"){ const t=camTarget(); if(camSnap){ cam.tx=t.tx; cam.ty=t.ty; cam.s=t.s; camSnap=false; } else { const k=Math.min(1,dt*6); cam.tx+=(t.tx-cam.tx)*k; cam.ty+=(t.ty-cam.ty)*k; cam.s+=(t.s-cam.s)*k; } } else camSnap=true;
    if(transCooldown>0) transCooldown-=dt;
    if(doorLock>0) doorLock=Math.max(0,doorLock-dt);

    cleanliness=Math.max(0,100-mess.length*(100/(10+Math.floor(seatsOwned/2))));

    // move Coony
    let vx=0,vz=0;
    if(keys.has("left"))vx-=1; if(keys.has("right"))vx+=1;
    if(keys.has("up"))vz-=1; if(keys.has("down"))vz+=1;
    if(heldDir){vx+=heldDir.dx; vz+=heldDir.dz;}
    if(jailT>0){ jailT-=dt; vx=0; vz=0; if(jailT<=0) addPopup("🔓 You are free!",CENTER,230,"#2C8A3E"); }
    const spd=1+0.25*shoeLvl;
    if(vx||vz){ const l=Math.hypot(vx,vz); vx/=l; vz/=l;
      const gs=Math.sqrt(gNow()); coony.x+=vx*0.85*spd*dt/gs; if(scene==="town") townP-=vz*340*spd*dt; else coony.z+=vz*0.6*spd*dt/gs; coony.walking=true; coony.legPhase+=dt*11;
      if(vx<0)coony.dir=-1; else if(vx>0)coony.dir=1; } else coony.walking=false;
    const XL=0.95; coony.x=Math.max(-XL,Math.min(XL,coony.x));
    if(scene==="town"){ coony.z=0.8; townP=Math.max(-8,Math.min(TOWN_MAXP,townP)); } else coony.z=Math.max(0.06,Math.min(0.97,coony.z));

    // scene transitions
    if(transCooldown<=0){
      if(scene==="inside" && coony.z>0.9 && coony.x>0.55 && doorLock<=0){
        scene="outside"; coony.x=0.7; coony.z=0.3; transCooldown=0.7; fade=1; sfx.door();
      } else if(scene==="inside"){
        if(coony.z<0.1&&floorLvl>=1&&Math.abs(coony.x-0.9)<0.08){ roomDoorX=0.9; enterRoom("up:1","inside"); }
        else if(coony.z<0.1){ for(const d of CAFE_DOORS) if(Math.abs(coony.x-d.x)<0.1){ roomDoorX=d.x; enterRoom(d.id,"inside"); break; } }
      } else if(scene==="outside"){
        if(coony.x>0.55 && coony.x<0.95 && coony.z<0.18){ scene="inside"; coony.x=0.55; coony.z=0.85; transCooldown=0.7; fade=1; doorLock=5; sfx.door(); }
        else if(coony.x<-0.6 && coony.z<0.2){ scene="rival"; coony.x=-0.2; coony.z=0.7; transCooldown=0.7; fade=1; sfx.door();
          addPopup("Sneaking into the rival café... 😈", CENTER, 200, "#4e2c78"); }
        else if(coony.x>-0.15 && coony.x<0.25 && coony.z<0.18){ scene="town"; coony.x=0.0; coony.z=0.85; transCooldown=0.7; fade=1; sfx.door(); townP=40; coony.z=0.8;
          addPopup("Welcome to TOWN! 🏙️ Walk forward!", CENTER, 200, "#4A2E17"); }
        else if(coony.x>-0.5 && coony.x<-0.05 && coony.z>0.92){ openBoss(); transCooldown=0.7; }
        else if(coony.x<-0.5 && coony.z>0.35){ // rival bin
          if(trashBag>0){ rivalCount=Math.max(0,rivalCount-trashBag);
            addPopup("Dumped "+trashBag+" on rival! 😼", CENTER, 220, "#2C8A3E");
            trashBag=0; sfx.dump(); transCooldown=0.6; }
        }
      } else if(scene==="town"){
        if(townP<-4){ scene="outside"; coony.x=0.05; coony.z=0.3; transCooldown=0.7; fade=1; sfx.door(); }
      } else if(scene==="rival"){
        if(coony.x<-0.6 && coony.z>0.9){ scene="outside"; coony.x=-0.75; coony.z=0.3; transCooldown=0.7; fade=1; sfx.door(); }
      }
    }

    if(scene==="room") roomUpdate(dt);

    if(scene==="town"&&!dlg){ for(const s of TOWN_SECRETS){ if(Math.abs(townP-s.p)<30&&Math.abs(coony.x-s.x)<0.06){ s.dw+=dt;
        if(s.dw>1.3){ s.dw=0; addPopup("✨ A SECRET DOOR opens! ✨", CENTER, 230, "#8E44AD"); enterRoom(s.to,"town"); break; } } else s.dw=0; } }
    if(scene==="town"&&!dlg){ for(const h of HOUSES){ const rel=h.d-townP, lat=Math.abs(coony.x-h.side*0.8);
        if(Math.abs(rel)>130||lat>0.95) houseCool[h.k]=false;
        else if(Math.abs(rel)<30&&lat<0.45&&!houseCool[h.k]){ houseCool[h.k]=true; houseIdx=h.k; enterRoom("house","town"); break; } } }
    if(scene==="town"&&!dlg){ for(const b of BLD){ const rel=b.d-townP, lat=Math.abs(coony.x-b.side*0.8);
        if(Math.abs(rel)>130||lat>0.95) bldCool[b.j]=false;
        else if(Math.abs(rel)<30&&lat<0.45&&!bldCool[b.j]){ bldCool[b.j]=true; bldIdx=b.j; enterRoom("bld","town"); break; } } }
    // chat with a café owner by walking up to them (they stand at the side of the street)
    if(scene==="town" && !dlg){
      for(let i=0;i<town.length;i++){ const rel=TOWN_D(i)-townP, ox=(i%2===0?-1:1)*0.8, lat=Math.abs(coony.x-ox);
        if(Math.abs(rel)>130||lat>0.95) talkCool[i]=false;
        else if(Math.abs(rel)<30 && lat<0.5 && !talkCool[i]){ talkCool[i]=true; openDlg(i); break; } } }

    // sink washes plates on its own (even while you are away)
    if(sinkDirty>0){ washT+=dt; if(washT>=WASH_TIMES[sinkLvl]){ washT=0; sinkDirty--; sinkClean++; } } else washT=0;

    // ---- waiter raccoons: fetch a plate from the pile and bring it to the customer who asked ----
    waiters.forEach((waiter,wi)=>{
      const home={x:PILE_PT.x+0.2+(wi%4)*0.08,z:0.72+Math.floor(wi/4)*0.06};
      if(waiter.state==="idle"){
        const dx=home.x-waiter.x, dz=home.z-waiter.z, d=Math.hypot(dx,dz); waiter.walking=false;
        if(d>0.04){ waiter.x+=dx/d*0.5*mdt; waiter.z+=dz/d*0.35*mdt; waiter.walking=true; waiter.legPhase+=dt*12; }
        if(pile>0){ let best=null;
          for(const c of customers){ if(c.state==="waiting" && !c.serving && foodStock>0 && (!best||c.patience<best.patience)) best=c; }
          if(best){ pile--; foodStock--; best.serving=true; waiter.c=best; waiter.carry=FOODS[best.want].e; waiter.state="toCust"; waiter.wait=1.0; } }
      } else if(waiter.state==="toCust"){
        const c=waiter.c; waiter.walking=false;
        if(waiter.wait>0){ waiter.wait-=dt; }
        else { const dx=c.x-waiter.x, dz=(c.z+0.12)-waiter.z, d=Math.hypot(dx,dz);
          if(d>0.04){ waiter.x+=dx/d*0.55*mdt; waiter.z+=dz/d*0.4*mdt; waiter.walking=true; waiter.legPhase+=dt*12; }
          else { if(c.state==="waiting"){ c.state="eating"; c.eat=EAT_TIME; c.mood="happy"; c.seat.plate={emoji:FOODS[c.want].e,dirty:false};
              sfx.serve(); const pp=project(c.x,c.z); addPopupW("🍽️ yum!", pp.sx, pp.sy-96, "#4A90D9"); }
            else { pile++; foodStock++; }
            waiter.state="idle"; waiter.c=null; waiter.carry=null; } }
      }
      waiter.x=Math.max(-0.95,Math.min(0.95,waiter.x)); waiter.z=Math.max(0.06,Math.min(0.97,waiter.z));
    });

    // customers (simulate even when outside)
    for(const c of customers){ c.bob+=dt*6;
      if(c.state==="entering"){ c.walking=true; c.legPhase+=dt*10;
        const dx=c.tx-c.x, dz=c.tz-c.z, d=Math.hypot(dx,dz);
        if(d<0.02){ c.x=c.tx; c.z=c.tz; c.state="waiting"; c.walking=false; c.pMax=patienceMax(); c.patience=c.pMax; c.want=pickWant(); }
        else { c.x+=dx/d*0.5*mdt; c.z+=dz/d*0.35*mdt; }
      } else if(c.state==="waiting"){
        if(cafesOpen()) c.patience-=dt; const r=c.patience/c.pMax;
        c.mood=r>0.55?"happy":(r>0.28?"meh":"grumpy");
        if(cafesOpen()) c.messTimer-=dt; if(c.messTimer<=0){ addMess(c.x+(Math.random()*0.16-0.08), c.z+0.13); c.messTimer=12+Math.random()*8; }
        if(pile>0 && foodStock<=0 && !c.serving){ noFoodFlash=1; }
        if(c.state==="waiting" && c.patience<=0){ c.state="leaving"; c.mood="angry"; c.walking=true; c.tx=-0.95; c.tz=0.08;
          c.seat.cust=null; leaving.push(c); addMess(c.seat.x, c.seat.z+0.15);
          addPopupW("😠 left!", project(c.x,c.z).sx, project(c.x,c.z).sy-90, "#E4572E"); }
      } else if(c.state==="eating"){
        c.eat-=dt; c.mood="happy";
        if(c.eat<=0){                           // finished: pays automatically, leaves a dirty plate
          const rw=Math.round(FOODS[c.want].reward*(c.seat.bed?BED_MULT:1)); money+=rw; ourCount++; servedTotal++; sfx.coin();
          const pp=project(c.x,c.z); addPopupW("+"+rw+"💰", pp.sx, pp.sy-96, "#2C8A3E");
          if(c.seat.plate) c.seat.plate.dirty=true;
          c.seat.cust=null; c.state="leaving"; c.mood="yay"; c.walking=true; c.tx=-0.95; c.tz=0.08; leaving.push(c);
          if(Math.random()<0.12){ const dr=CAFE_DOORS[(Math.random()*CAFE_DOORS.length)|0], rr=SROOMS[dr.id]; c.door=dr; c.tx=dr.x; c.tz=0.06; addPopupW(rr.e+" Off to the "+rr.name+"!", pp.sx, pp.sy-120, "#8E44AD"); }
          if(Math.random()<0.1) addMess(c.seat.x, c.seat.z+0.15); }
      }
    }
    customers=customers.filter(c=>c.state!=="leaving");

    // sweep mess (inside, walk over)
    if(scene==="inside"){ const cp=project(coony.x,coony.z);
      for(let i=mess.length-1;i>=0;i--){ const pp=project(mess[i].x,mess[i].z);
        if(Math.hypot(cp.sx-pp.sx, cp.sy-pp.sy)<90){ mess.splice(i,1); trashBag++; sfx.clean();
          addPopupW("swept! 🧹", cp.sx, cp.sy-70, "#4A90D9"); } }
      // pick up dirty plates by walking to the seat
      for(const st of seats){ if(st.plate && st.plate.dirty && carryDirty<CARRY_MAX){ const sp=project(st.x,st.z+0.1);
        if(Math.hypot(cp.sx-sp.sx,cp.sy-sp.sy)<100){ st.plate=null; carryDirty++; sfx.pick(); addPopupW("dirty plate 🍽️", cp.sx, cp.sy-70, "#8a5a2b"); } } }
      // sink: drop dirty plates, take clean ones
      const sk=project(SINK_PT.x,SINK_PT.z);
      if(Math.hypot(cp.sx-sk.sx,cp.sy-sk.sy)<SINK_ZONE){
        if(carryDirty>0){ sinkDirty+=carryDirty; addPopupW("🫧 washing x"+carryDirty, cp.sx, cp.sy-70, "#4A90D9"); carryDirty=0; sfx.clean(); }
        if(sinkClean>0 && carryClean<CARRY_MAX){ const t=Math.min(sinkClean,CARRY_MAX-carryClean); sinkClean-=t; carryClean+=t;
          sfx.pick(); addPopupW("clean plates ✨ x"+carryClean, cp.sx, cp.sy-70, "#2C8A3E"); } }
      // pile: put clean plates down
      const pl=project(PILE_PT.x,PILE_PT.z);
      if(carryClean>0 && Math.hypot(cp.sx-pl.sx,cp.sy-pl.sy)<110){ pile+=carryClean; addPopupW("+"+carryClean+" plates in the pile!", cp.sx, cp.sy-70, "#2C8A3E"); carryClean=0; sfx.coin(); }
    }
    coony.holding=(carryDirty+carryClean>0)?{emoji:"🍽️"}:null;

    // ---- plate workers: collect dirty plates, wash them at the sink, stack clean ones in the pile ----
    workers.forEach((worker,wi)=>{
      worker.walking=false;
      const claimed=new Set(workers.filter(w=>w!==worker&&w.tgt).map(w=>w.tgt));
      const dirtySeats=seats.filter(st=>st.plate&&st.plate.dirty&&!claimed.has(st));
      let gx=null,gz=null,act=null,tgt=null;
      if(worker.carryC>0){ gx=PILE_PT.x; gz=PILE_PT.z; act="dropC"; }
      else if(worker.carryD>=3 || (worker.carryD>0 && !dirtySeats.length)){ gx=SINK_PT.x; gz=SINK_PT.z; act="dropD"; }
      else if(dirtySeats.length){ let bd=1e9; for(const st of dirtySeats){ const d=Math.hypot(st.x-worker.x,st.z-worker.z); if(d<bd){bd=d;tgt=st;} }
        gx=tgt.x; gz=tgt.z+0.1; act="pickD"; }
      else if(sinkClean>0){ gx=SINK_PT.x; gz=SINK_PT.z; act="pickC"; }
      worker.tgt=(act==="pickD")?tgt:null;
      if(act){
        const dx=gx-worker.x, dz=gz-worker.z, d=Math.hypot(dx,dz);
        if(d>0.05){ worker.x+=dx/d*0.7*mdt; worker.z+=dz/d*0.5*mdt; worker.walking=true; worker.legPhase+=dt*12; }
        else if(act==="pickD"){ if(tgt&&tgt.plate&&tgt.plate.dirty){ tgt.plate=null; worker.carryD++; sfx.pick(); } }
        else if(act==="dropD"){ sinkDirty+=worker.carryD; worker.carryD=0; sfx.clean(); }
        else if(act==="pickC"){ const t=Math.min(sinkClean,CARRY_MAX); sinkClean-=t; worker.carryC+=t; sfx.pick(); }
        else if(act==="dropC"){ pile+=worker.carryC; worker.carryC=0; sfx.coin(); }
      } else {
        const dx=SINK_PT.x-0.2-(wi%4)*0.1-worker.x, dz=(SINK_PT.z+0.15)-worker.z, d=Math.hypot(dx,dz);
        if(d>0.12){ worker.x+=dx/d*0.4*mdt; worker.z+=dz/d*0.3*mdt; worker.walking=true; worker.legPhase+=dt*12; }
      }
      worker.x=Math.max(-0.95,Math.min(0.95,worker.x));
      worker.z=Math.max(0.06,Math.min(0.97,worker.z));
    });

    // ---- cleaner raccoons sweep up mess on their own ----
    cleaners.forEach((cleaner,ci)=>{
      cleaner.walking=false;
      if(cleaner.target && mess.indexOf(cleaner.target)<0) cleaner.target=null;
      if(!cleaner.target && mess.length){
        const taken=new Set(cleaners.filter(c=>c!==cleaner&&c.target).map(c=>c.target));
        let bestD=1e9,best=null;
        for(const mm of mess){ if(taken.has(mm)) continue; const d=Math.hypot(mm.x-cleaner.x, mm.z-cleaner.z); if(d<bestD){ bestD=d; best=mm; } }
        cleaner.target=best;
      }
      if(cleaner.target){
        const mm=cleaner.target, dx=mm.x-cleaner.x, dz=mm.z-cleaner.z, d=Math.hypot(dx,dz);
        if(d>0.03){ cleaner.x+=dx/d*0.62*mdt; cleaner.z+=dz/d*0.42*mdt; cleaner.walking=true; cleaner.legPhase+=dt*12; }
        else { const i=mess.indexOf(mm); if(i>=0){ mess.splice(i,1); trashBag++; sfx.clean(); } cleaner.target=null; }
      } else {
        const dx=coony.x+(ci%2?0.14:-0.14)*(1+Math.floor(ci/2))-cleaner.x, dz=(coony.z-0.06)-cleaner.z, d=Math.hypot(dx,dz);
        if(d>0.16){ cleaner.x+=dx/d*0.4*mdt; cleaner.z+=dz/d*0.3*mdt; cleaner.walking=true; cleaner.legPhase+=dt*12; }
      }
      cleaner.x=Math.max(-0.95,Math.min(0.95,cleaner.x));
      cleaner.z=Math.max(0.06,Math.min(0.97,cleaner.z));
    });

    // ---- builders build seats and grow the café for you ----
    builders.forEach((b,bi)=>{ b.walking=false; b.t-=dt;
      if(b.t<=0||b.tx===undefined){ const ns=seats[seatsOwned]; if(ns&&seatsOwned<capNow()){ b.tx=ns.x+(bi%2?0.06:-0.06); b.tz=ns.z+0.08; } else { b.tx=Math.random()*1.6-0.8; b.tz=0.2+Math.random()*0.6; } b.t=4+Math.random()*3; }
      const dx=b.tx-b.x, dz=b.tz-b.z, d=Math.hypot(dx,dz);
      if(d>0.04){ b.x+=dx/d*0.5*mdt; b.z+=dz/d*0.35*mdt; b.walking=true; b.legPhase+=dt*12; } });
    if(builders.length){
      if(seatsOwned<Math.min(capNow(),maxSeatsNow())){ buildT+=dt*builders.length/22;
        if(buildT>=1){ buildT=0; seats[seatsOwned].owned=true; seatsOwned++; sfx.buy(); addPopup("🔨 Builders built a new seat!", CENTER, 240, "#B8860B"); } }
      else if(spaceLvl<MAX_SPACE){ buildT+=dt*builders.length/70;
        if(buildT>=1){ buildT=0; spaceLvl++; sfx.buy(); addPopup("🔨 Builders made your café BIGGER!", CENTER, 240, "#B8860B"); } } }

    // ---- rival raiders sneak into YOUR café to sabotage it. Catch them by walking into them! ----
    if(scene==="inside"){ raidTimer-=dt; if(raidTimer<=0&&raiders.length<2){ raidTimer=40+Math.random()*30; spawnRaider(); } }
    for(const r of raiders){ r.bob+=dt*6; r.walking=true; r.legPhase+=dt*10;
      if(r.state==="in"){ const dx=r.tx-r.x, dz=r.tz-r.z, d=Math.hypot(dx,dz);
        if(d>0.05){ r.x+=dx/d*0.45*mdt; r.z+=dz/d*0.32*mdt; } else { doRaid(r); r.state="out"; r.tx=-0.95; r.tz=0.08; }
        if(r.state==="in"&&scene==="inside"&&Math.hypot(r.x-coony.x,(r.z-coony.z)*0.8)<0.16){ r.state="caught"; r.mood="scared"; r.tx=-0.95; r.tz=0.08; money+=15; sfx.scare(); const pp=project(r.x,r.z); addPopupW("😼 Caught a sneaky rival! +£15", pp.sx, pp.sy-110, "#2C8A3E"); } }
      else { const dx=r.tx-r.x, dz=r.tz-r.z, d=Math.hypot(dx,dz)||1; r.x+=dx/d*0.7*mdt; r.z+=dz/d*0.5*mdt; } }
    raiders=raiders.filter(r=>r.state==="in"||r.x>-0.93);

    // ---- customers talk to each other and to Coony ----
    { const cpx=project(coony.x,coony.z);
      for(const c of customers){ if(c.sayT>0){ c.sayT-=dt; if(c.sayT<=0) c.say=null; } c.sayCool=(c.sayCool===undefined?Math.random()*5:c.sayCool)-dt;
        if((c.state==="waiting"||c.state==="eating")&&!c.say&&c.sayCool<=0){ const pp=project(c.x,c.z);
          const near=scene==="inside"&&Math.hypot(pp.sx-cpx.sx,pp.sy-cpx.sy)<130;
          if(near||Math.random()<dt*0.04){ c.say=pickSay(c); c.sayT=2.8; c.sayCool=8+Math.random()*6; } } } }

    // leaving anim
    for(const c of leaving){ c.bob+=dt*6; c.walking=true; c.legPhase+=dt*10;
      const dx=c.tx-c.x, dz=c.tz-c.z, d=Math.hypot(dx,dz)||1; c.x+=dx/d*0.55*mdt; c.z+=dz/d*0.4*mdt; }
    for(const c of leaving) if(c.door&&Math.hypot(c.tx-c.x,c.tz-c.z)<0.05) c.gone=true;
    leaving=leaving.filter(c=>c.door?!c.gone:c.x>-0.93);

    // spawns
    if(cafesOpen()) spawnTimer-=dt;
    if(spawnTimer<=0 && cafesOpen()){
      if(cleanliness<=15){ tooMessyFlash=1; spawnTimer=0.8; }
      else if(freeSeat()){ spawnCustomer(); const base=Math.max(3.5,5.5-servedTotal*0.05);
        spawnTimer=base*(1+(1-cleanliness/100)*2.2)/Math.min(6,1+Math.max(0,seatsOwned-4)*0.08); }
      else spawnTimer=0.6;
    }
    // rival keeps winning customers over time (but no longer throws mess — mess comes from people)
    // the rival café runs for real: customers come in, get served (+1 for them) unless you sabotage
    if(spoilCd>0)spoilCd-=dt; if(rivalSpoil>0)rivalSpoil-=dt; if(rivalSmelly>0)rivalSmelly-=dt;
    for(const m of rmess) m.life-=dt; rmess=rmess.filter(m=>m.life>0);
    for(const cl of clouds) cl.life-=dt; clouds=clouds.filter(cl=>cl.life>0);
    const rdt=cafesOpen()?dt:0; rivalSpawn-=rdt;
    if(rivalSpawn<=0){ rivalSpawn=Math.max(16,22-servedTotal*0.05);
      if(rivalSmelly<=0){ const used=new Set(rcust.filter(c=>c.state!=="leaving").map(c=>c.slot)); let sl=-1;
        for(let i=0;i<RSLOTS.length;i++) if(!used.has(i)){ sl=i; break; }
        if(sl>=0) rcust.push({ x:-0.9, z:0.1, slot:sl, tx:RSLOTS[sl].x, tz:RSLOTS[sl].z, state:"entering", mood:"happy", serve:0, patience:1,
          walking:true, legPhase:Math.random()*6, bob:Math.random()*6, shirt:SHIRTS[(Math.random()*SHIRTS.length)|0],
          skin:SKINS[(Math.random()*SKINS.length)|0], hat:HATS[(Math.random()*HATS.length)|0] }); } }
    for(const c of rcust){ c.bob+=dt*6;
      if(c.state==="entering"){ c.walking=true; c.legPhase+=dt*10;
        const dx=c.tx-c.x, dz=c.tz-c.z, d=Math.hypot(dx,dz);
        if(d<0.02){ c.x=c.tx; c.z=c.tz; c.state="waiting"; c.walking=false; } else { c.x+=dx/d*0.5*dt; c.z+=dz/d*0.35*dt; }
      } else if(c.state==="waiting"){
        if(rivalSpoil>0){ c.patience-=rdt/6; c.mood=c.patience>0.5?"meh":"grumpy";
          if(c.patience<=0){ c.state="leaving"; c.mood="angry"; c.walking=true; c.tx=-0.95; c.tz=0.08; } }
        else { c.mood="happy"; c.serve+=rdt/9;
          if(c.serve>=1){ c.state="leaving"; c.mood="yay"; c.walking=true; c.tx=-0.95; c.tz=0.08; if(rivalCount<Math.max(0,ourCount-1)) rivalCount++;
            if(scene==="rival"){ const pp=project(c.x,c.z); addPopupW("+1 rival 😾", pp.sx, pp.sy-96, "#8E44AD"); } } }
        if(scene==="rival" && c.state==="waiting" && Math.hypot(c.x-coony.x,(c.z-coony.z)*0.8)<0.14){
          c.state="leaving"; c.mood="scared"; c.walking=true; c.tx=-0.95; c.tz=0.08; sfx.scare();
          const pp=project(c.x,c.z); addPopupW("😱 BOO!", pp.sx, pp.sy-96, "#E4572E"); }
      } else { c.walking=true; c.legPhase+=dt*10;
        const dx=c.tx-c.x, dz=c.tz-c.z, d=Math.hypot(dx,dz)||1; c.x+=dx/d*0.55*dt; c.z+=dz/d*0.4*dt; }
    }
    rcust=rcust.filter(c=>!(c.state==="leaving" && c.x<=-0.93));

    // the round ends on the timer, and you always win the Café War
  }

    if(builders.length&&(scene==="inside"||scene==="outside")){ const cap=capNow(), nextSeat=seatsOwned<Math.min(cap,maxSeatsNow()), done=!nextSeat&&spaceLvl>=MAX_SPACE;
      ctx.fillStyle="#4A2E17"; ctx.font="bold 12px 'Comic Sans MS'"; ctx.textAlign="left"; ctx.textBaseline="middle";
      ctx.fillText(done?"🔨 Builders: café is finished!":"🔨 Building the next "+(nextSeat?"seat":"room size")+"...",14,86);
      if(!done){ ctx.fillStyle="rgba(0,0,0,0.2)"; roundRect(14,94,160,10,5); ctx.fill(); ctx.fillStyle="#B8860B"; roundRect(14,94,Math.max(4,160*Math.min(1,buildT)),10,5); ctx.fill(); } }
    // hire buttons: every hire costs £20 more
    if(scene==="inside"||scene==="outside"){
      [["worker",hireBtn,"🍽️ Plate Worker","#2C8A3E"],["cleaner",cleanerBtn,"🧹 Cleaner","#4A90D9"],["waiter",waiterBtn,"🛎️ Waiter","#C0392B"],["builder",builderBtn,"🔨 Builder","#B8860B"]].forEach(([id,b,label,col])=>{
        const n=staffList(id).length, maxed=n>=STAFF_MAX, cost=staffNext(id), can=!maxed&&money>=cost;
        ctx.fillStyle=can?col:"rgba(120,110,100,0.65)"; roundRect(b.x,b.y,b.w,b.h,8); ctx.fill();
        ctx.fillStyle="#fff"; ctx.font="bold 13px 'Comic Sans MS'"; ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText(maxed?label+" MAX ("+n+")":label+" £"+cost+"  ("+n+")", b.x+b.w/2, b.y+b.h/2); }); }
  }

  function drawBottomBar(){
    ctx.fillStyle="#EAD6BE"; ctx.fillRect(0,barY-16,W,H-(barY-16));
    ctx.fillStyle="#4A2E17"; ctx.font="bold 12px 'Comic Sans MS'"; ctx.textAlign="left"; ctx.textBaseline="middle";
    ctx.fillText("🍽️ The waiter brings plates and customers pay on their own. Dirty plate → sink → pile.  Tap to buy:", invAreaX, barY-6);
    const cap=capNow();
    const sCost=(seatsOwned>=maxSeatsNow()||seatsOwned>=cap)?null:seatCost(seatsOwned);
    const items={
      food:{t:"🍔 Food: "+foodStock, s:"tap: +"+(FOOD_PACK*(1+spaceLvl))+" for £"+PRICE, on:money>=PRICE, col:"#2C8A3E"},
      info:{t:"🍽️ Pile: "+pile+" plates", s:"sink: "+sinkDirty+" dirty, "+sinkClean+" clean", on:true, col:"#b08a5a"},
      seat:{t:seatsOwned>=maxSeatsNow()?"💺 Seats MAX":"💺 Seat £"+seatCost(seatsOwned), s:seatsOwned>=maxSeatsNow()?maxSeatsNow()+" of "+maxSeatsNow():(seatsOwned>=cap?"needs bigger room":seatsOwned+" of "+cap+" seats"), on:sCost!==null&&money>=sCost, col:"#4A90D9"},
      space:{t:spaceLvl>=MAX_SPACE?"🏠 Room MAX":"🏠 Room £"+SPACE_COSTS[spaceLvl], s:spaceLvl>=MAX_SPACE?"fits "+maxSeatsNow()+" seats":"fits up to "+SPACE_CAP[spaceLvl+1]+" seats", on:spaceLvl<MAX_SPACE&&money>=SPACE_COSTS[spaceLvl], col:"#8E44AD"},
      floor:{t:floorLvl>=MAX_FLOORS?"🏢 Floors MAX":"🏢 Floor £"+FLOOR_COST, s:floorLvl>=MAX_FLOORS?(MAX_FLOORS+1)+" floors":"floor "+(floorLvl+2)+": WAY bigger", on:floorLvl<MAX_FLOORS&&money>=FLOOR_COST, col:"#34495e"},
      sink:{t:sinkLvl>=3?"🧽 Sink MAX":"🧽 Sink £"+SINK_COSTS[sinkLvl], s:sinkLvl>=3?"wash "+WASH_TIMES[3]+"s":"wash "+WASH_TIMES[sinkLvl]+"s → "+WASH_TIMES[sinkLvl+1]+"s", on:sinkLvl<3&&money>=SINK_COSTS[sinkLvl], col:"#E8863A"} };
    for(const b of botBtns){ const f=items[b.id];
      ctx.fillStyle=f.on?f.col:"rgba(120,110,100,0.55)"; roundRect(b.x,b.y,b.w,b.h,10); ctx.fill();
      ctx.fillStyle="#fff"; ctx.font="bold 16px 'Comic Sans MS'"; ctx.textAlign="center";
      ctx.fillText(f.t, b.x+b.w/2, b.y+b.h/2-9); ctx.font="12px 'Comic Sans MS'"; ctx.fillText(f.s, b.x+b.w/2, b.y+b.h/2+11); }
  }

  function drawDpad(){ ctx.textAlign="center"; ctx.textBaseline="middle";
    for(const k in dpad){ const d=dpad[k]; const on=heldDir&&heldDir.dx===d.dx&&heldDir.dz===d.dz;
      ctx.fillStyle=on?"rgba(232,134,58,0.85)":"rgba(255,255,255,0.5)"; roundRect(d.x,d.y,d.w,d.h,8); ctx.fill();
      ctx.strokeStyle="rgba(122,74,34,0.6)"; ctx.lineWidth=2; roundRect(d.x,d.y,d.w,d.h,8); ctx.stroke();
      ctx.fillStyle="#4A2E17"; ctx.font="bold 18px sans-serif"; ctx.fillText(d.label,d.x+d.w/2,d.y+d.h/2+1); }
    ctx.fillStyle="rgba(74,46,23,0.55)"; ctx.font="bold 11px 'Comic Sans MS'"; ctx.fillText("move (or arrow keys)",DP.cx,DP.cy+62); }

  function drawPopups(){ ctx.textAlign="center"; ctx.textBaseline="middle";
    for(const p of popups){ ctx.globalAlpha=Math.max(0,Math.min(1,p.life)); ctx.fillStyle=p.color;
      ctx.font="bold 20px 'Comic Sans MS'"; ctx.fillText(p.text,p.x,p.y); ctx.globalAlpha=1; } }

  function drawNoFood(){ if(noFoodFlash<=0||scene==="rival")return; ctx.globalAlpha=Math.min(1,noFoodFlash);
    ctx.fillStyle="#C0392B"; ctx.font="bold 24px 'Comic Sans MS'"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("Out of food! Tap 🍔 Food at the bottom to buy more", CENTER, 175); ctx.globalAlpha=1; }
  function drawTooMessy(){ if(tooMessyFlash<=0)return; ctx.globalAlpha=Math.min(1,tooMessyFlash);
    ctx.fillStyle="#C0392B"; ctx.font="bold 26px 'Comic Sans MS'"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("😖 Too messy! Sweep up so people come in!", CENTER, 140); ctx.globalAlpha=1; }

  function drawFade(){ if(fade<=0)return; ctx.fillStyle="rgba(0,0,0,"+(fade*0.7)+")"; ctx.fillRect(0,0,W,H); }

  function drawBigButton(label){ ctx.fillStyle="#E8863A"; roundRect(bigBtn.x,bigBtn.y,bigBtn.w,bigBtn.h,18); ctx.fill();
    ctx.fillStyle="#C86A22"; roundRect(bigBtn.x,bigBtn.y+bigBtn.h-10,bigBtn.w,10,{tl:0,tr:0,br:18,bl:18}); ctx.fill();
    ctx.fillStyle="#fff"; ctx.font="bold 30px 'Comic Sans MS'"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(label,W/2,bigBtn.y+bigBtn.h/2-2); }

  function drawTitle(){
    drawRoom();
    const p=project(0,0.72); ctx.save(); ctx.translate(p.sx,p.sy); ctx.scale(p.scale,p.scale); coonyLocal(); ctx.restore();
    ctx.fillStyle="rgba(255,255,255,0.93)"; roundRect(W/2-370,54,740,400,22); ctx.fill();
    ctx.strokeStyle="#E8863A"; ctx.lineWidth=5; roundRect(W/2-370,54,740,400,22); ctx.stroke();
    ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillStyle="#4A2E17"; ctx.font="bold 40px 'Comic Sans MS'";
    ctx.fillText("Coony's Café — 3D Café War! 🦝", W/2, 98);
    ctx.font="17px 'Comic Sans MS'"; ctx.fillStyle="#7a5233";
    const lines=[
      "🕹️  Move Coony with ARROW KEYS / WASD (or the on-screen buttons).",
      "🚪  Doors on the back wall lead to LOTS of rooms! Beds in the café pay 50% more.",
      "🍽️  They leave a DIRTY plate. Walk over it to pick it up, then take it to the SINK.",
      "✨  When the plates are clean, pick them up and put them in the PILE.",
      "🛒  Out of food? Tap 🍔 Food at the bottom. Buy seats, space and a faster sink there too!",
      "👹  BOSS DOOR on the street: tap the boss as FAST as you can. He grows and so does your café!",
      "🚪  Go out the EXIT, then through the RIVAL CAFÉ door to sneak in and sabotage!",
      "🦝  Hire plate workers, cleaners, waiters and BUILDERS (top right). Each costs £20 more!",
      "🏙️  Visit TOWN (the gate on the street) to chat with other café owners, lie, take tours and SWAP cafés!",
      "🏁  No timer, no ending! Keep building your café forever.",
    ];
        lines.forEach((t,i)=>ctx.fillText(t,W/2,140+i*30));
    drawBigButton("▶  PLAY");
  }
  function drawGameOver(){
    if(scene==="outside") drawOutside(); else if(scene==="rival") drawRival(); else if(scene==="town") drawTown(); else drawRoom();
    ctx.fillStyle="rgba(0,0,0,0.45)"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="rgba(255,255,255,0.96)"; roundRect(W/2-320,120,640,350,22); ctx.fill();
    ctx.strokeStyle="#E8863A"; ctx.lineWidth=5; roundRect(W/2-320,120,640,350,22); ctx.stroke();
    ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillStyle="#4A2E17"; ctx.font="bold 44px 'Comic Sans MS'";
    ctx.fillText("You WON the Café War! 🏆", W/2, 176);
    ctx.font="24px 'Comic Sans MS'"; ctx.fillStyle="#2C8A3E";
    ctx.fillText("🦝 You: "+ourCount+"   vs   Rival: "+rivalCount+" 😾", W/2, 232);
    ctx.fillStyle="#8E44AD"; ctx.font="bold 26px 'Comic Sans MS'";
    ctx.fillText(roundGrow>0?"🏠 Your café got BIGGER! Room for "+capNow()+" seats":"🏠 Your café is already HUGE!", W/2, 284);
    ctx.fillStyle="#E8863A"; ctx.fillText("💰 +£50 bonus!  Money: "+money, W/2, 332);
    ctx.fillStyle="#7a5233"; ctx.font="18px 'Comic Sans MS'"; ctx.fillText("The rival café can't catch you. Ready for round "+roundNo+"?", W/2, 380);
    drawBigButton("▶  NEXT ROUND");
  }

  function drawBoss(){ if(!boss) return; ctx.save(); if(boss.shake>0) ctx.translate((Math.random()-0.5)*20*boss.shake,(Math.random()-0.5)*20*boss.shake); drawBoss0();
    if(boss&&boss.phase==="fight"){ ctx.textBaseline="middle";
      if(boss.combo>=2){ ctx.fillStyle="#ffd84a"; ctx.strokeStyle="#2b0808"; ctx.lineWidth=5; ctx.font="bold 26px 'Comic Sans MS'"; ctx.textAlign="left"; ctx.strokeText("🔥 COMBO x"+boss.combo,24,110); ctx.fillText("🔥 COMBO x"+boss.combo,24,110); }
      ctx.textAlign="left"; ctx.font="bold 22px 'Comic Sans MS'"; ctx.fillStyle="#8ad8ff"; if(boss.shield>0) ctx.fillText("🛡️ x"+boss.shield,24,145); if(boss.slow>0){ ctx.fillStyle="#ffd84a"; ctx.fillText("⚡ "+Math.ceil(boss.slow)+"s",110,145); }
      ctx.textAlign="center"; ctx.font="30px 'Segoe UI Emoji'"; for(const q of boss.parts){ ctx.globalAlpha=Math.max(0,q.life); ctx.fillText(q.e,q.x,q.y); } ctx.globalAlpha=1;
      if(boss.fb){ const f=boss.fb, pul=1+Math.sin(performance.now()/90)*0.1; ctx.strokeStyle="#ff4020"; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(f.x,f.y,22+40*(f.t/3.2),0,Math.PI*2); ctx.stroke(); ctx.fillStyle="#000"; ctx.font=Math.round(66*pul)+"px 'Segoe UI Emoji'"; ctx.fillText("🔥",f.x,f.y); }
      if(boss.say){ ctx.font="bold 16px 'Comic Sans MS'"; const tw=ctx.measureText(boss.say).width+32; ctx.fillStyle="rgba(255,255,255,0.93)"; roundRect(CENTER-tw/2,644,tw,30,15); ctx.fill(); ctx.fillStyle="#4A2E17"; ctx.fillText((BOSSES[bossLvl]?BOSSES[bossLvl].e:"")+" "+boss.say,CENTER,659); } }
    else if(boss&&boss.phase==="done"&&boss.cry&&!boss.rival){ ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillStyle="#fff"; ctx.strokeStyle="#2b0808"; ctx.lineWidth=5; ctx.font="bold 22px 'Comic Sans MS'"; ctx.strokeText(BOSSES[bossLvl].e+" \""+boss.cry+"\"",CENTER,335); ctx.fillText(BOSSES[bossLvl].e+" \""+boss.cry+"\"",CENTER,335); }
    ctx.restore(); }
  function drawBoss0(){ if(!boss) return;
    ctx.fillStyle=boss.flash>0?"rgba(120,10,10,0.95)":"rgba(40,8,8,0.93)"; ctx.fillRect(0,0,W,H);
    ctx.lineJoin="round"; function T(txt,y,px,col){ ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.font="bold "+px+"px 'Comic Sans MS'"; ctx.lineWidth=7; ctx.strokeStyle="#2b0808"; ctx.strokeText(txt,CENTER,y); ctx.fillStyle=col; ctx.fillText(txt,CENTER,y); }
    if(boss.phase==="pick"){
      T("👹 PICK A BOSS!",50,38,"#ffd84a"); T("Do the bosses in any order. Beat ALL 8 on a page to unlock the next page!",100,18,"#fff");
      for(let j=0;j<PG;j++){ const i=boss.page*PG+j; if(i>=BOSSES.length) break; const b=BOSSES[i], r=pickRects[j], open=i<=bossBeaten;
        ctx.fillStyle=open?"rgba(255,255,255,0.92)":"rgba(120,120,120,0.6)"; roundRect(r.x,r.y,r.w,r.h,20); ctx.fill(); ctx.strokeStyle=bossDone[i]?"#6BBF59":"#ffd84a"; ctx.lineWidth=5; roundRect(r.x,r.y,r.w,r.h,20); ctx.stroke();
        ctx.fillStyle="#000"; ctx.font="56px 'Segoe UI Emoji'"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(open?b.e:"🔒",r.x+r.w/2,r.y+48);
        ctx.fillStyle=open?"#4A2E17":"#333"; ctx.font="bold "+(b.n.length>18?13:15)+"px 'Comic Sans MS'"; ctx.fillText(b.n,r.x+r.w/2,r.y+98); ctx.font="14px 'Comic Sans MS'"; ctx.fillText((b.t==="tap"?b.count+" emojis · "+b.good+" good":BTL[b.t])+(bossDone[i]?" ✅":""),r.x+r.w/2,r.y+124); }
      for(const [bt,lab,on] of [[pgPrev,"◀ Back",boss.page>0],[pgNext,"More ▶",(boss.page+1)*PG<BOSSES.length]]){ ctx.fillStyle=on?"#4A90D9":"rgba(120,120,120,0.5)"; roundRect(bt.x,bt.y,bt.w,bt.h,14); ctx.fill(); ctx.fillStyle="#fff"; ctx.font="bold 22px 'Comic Sans MS'"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(lab,bt.x+bt.w/2,bt.y+bt.h/2); }
      T("Page "+(boss.page+1)+" of "+Math.ceil(BOSSES.length/PG),590,18,"#fff");
      drawBigButton("LEAVE"); return; }
    const t=boss.taps, need=boss.need||BOSS_NEED, B=BOSSES[bossLvl], size=boss.phase==="done"?240:(130+t*14)*(1+boss.pop*0.1);
    ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillStyle="#000";
    if(!(boss.mg&&boss.phase==="fight")){ ctx.font=Math.round(size)+"px 'Segoe UI Emoji'"; ctx.fillText(boss.phase==="done"?"😵":B.e, CENTER, 270+(boss.flash>0?Math.sin(performance.now()/40)*8:0)); }
    T(boss.rival?"⚔️ DRAGON DUEL vs "+boss.rival.o.name:(B.e+" "+B.n.toUpperCase()+"!"),46,boss.rival?30:38,"#ffd84a");
    if(boss.phase==="fight"){
      ctx.fillStyle="#C0392B"; roundRect(fightLeave.x,fightLeave.y,fightLeave.w,fightLeave.h,12); ctx.fill(); ctx.strokeStyle="#fff"; ctx.lineWidth=3; roundRect(fightLeave.x,fightLeave.y,fightLeave.w,fightLeave.h,12); ctx.stroke();
      ctx.fillStyle="#fff"; ctx.font="bold 20px 'Comic Sans MS'"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("🚪 LEAVE",fightLeave.x+fightLeave.w/2,fightLeave.y+fightLeave.h/2);
      if(boss.rival){ ctx.fillStyle="rgba(255,255,255,0.25)"; roundRect(CENTER-250,102,500,12,6); ctx.fill(); ctx.fillStyle="#E5533D"; roundRect(CENTER-250,102,Math.max(4,500*boss.rival.taps/BOSS_NEED),12,6); ctx.fill(); }
      ctx.fillStyle="rgba(255,255,255,0.25)"; roundRect(CENTER-250,80,500,18,9); ctx.fill();
      ctx.fillStyle="#6BBF59"; roundRect(CENTER-250,80,Math.max(4,500*t/need),18,9); ctx.fill();
      if(boss.mg){ if(boss.mg.t!=="maze") T("⭐ "+t+" / "+need,120,22,"#fff"); mgDraw(T); return; }
      T("⭐ "+t+" / "+BOSS_NEED+"   Tap the GOOD ones: "+GOOD_EMOJI.slice(0,B.good).join(" ")+"  (not the bad ones!)",boss.rival?138:126,21,"#fff");
      boss.rects.forEach((r,i)=>{ const it=boss.items[boss.order[i]];
        ctx.fillStyle="rgba(255,255,255,0.92)"; roundRect(r.x,r.y,r.w,r.h,Math.min(22,r.w/4)); ctx.fill(); ctx.strokeStyle="#ffd84a"; ctx.lineWidth=4; roundRect(r.x,r.y,r.w,r.h,Math.min(22,r.w/4)); ctx.stroke();
        ctx.fillStyle="#000"; ctx.font=Math.round(Math.min(84,r.w*0.7,r.h*0.7))+"px 'Segoe UI Emoji'"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(it.e,r.x+r.w/2,r.y+r.h/2+3); });
      return; }
    if(boss.arcade){ T("🕹️ You won the game!",120,34,"#fff"); T("💰 +£60",180,30,"#ffd84a"); drawBigButton("BACK"); return; }
    if(boss.rival){ const nm=boss.rival.o.name;
      if(boss.duelWin){ T("🏆 YOU WON THE DUEL!",110,34,"#fff"); T("💨 You farted on "+nm+"!",160,26,"#9be37a"); T("Everyone LEFT their café! 😭  💰 +£"+boss.reward.m,205,24,"#ffd84a"); }
      else { T("😭 "+nm+" WON!",110,34,"#fff"); T("💨 They farted on YOUR café!",160,26,"#ff9b8a"); T("All your customers ran away! New ones come soon.",205,22,"#ffd84a"); }
      drawBigButton("BACK"); return; }
    T("You beat the "+B.n+"! 🏆",110,32,"#fff");
    const r=boss.reward; T("💰 +£"+r.m,160,28,"#ffd84a");
    T(r.g>0?"🏠 Your café got BIGGER!":"🏠 Your café is as big as it can get!",205,22,"#9be37a");
    if(r.unlocked) T("🔓 NEW BOSS UNLOCKED!",245,26,"#ffd84a");
    T(r.fl?"🏢 FREE NEW FLOOR! Take the stairs ⬆️":"🏢 You have every floor!",285,24,"#8ad8ff");
    drawBigButton("BACK"); }

  // ---------- main ----------
  function render(){
    ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H);
    if(state==="title"){ drawTitle(); return; }
    if(state==="gameover"){ drawGameOver(); return; }
    if(scene==="inside"){ ctx.save(); ctx.translate(cam.tx,cam.ty); ctx.scale(cam.s,cam.s); drawInside(); ctx.restore(); } else if(scene==="rival") drawRival(); else if(scene==="town") drawTown(); else if(scene==="room") drawSideRoom(); else drawOutside();
    drawTopHUD();
    if(scene==="rival") drawSabotageBar(); else drawBottomBar();
    drawDpad();
    drawTooMessy();
    drawNoFood();
    drawBoss();
    drawPopups();
    drawFade();
    drawDialog();
    if(scene==="town"&&!dlg&&!boss&&state==="playing"){ if(!placesOpen){ ctx.fillStyle="#4A90D9"; roundRect(placesBtn.x,placesBtn.y,placesBtn.w,placesBtn.h,10); ctx.fill(); ctx.fillStyle="#fff"; ctx.font="bold 15px 'Comic Sans MS'"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("🗺️ Find places",placesBtn.x+placesBtn.w/2,placesBtn.y+placesBtn.h/2); }
      else { ctx.fillStyle="rgba(0,0,0,0.65)"; ctx.fillRect(0,0,W,H); ctx.fillStyle="#fff"; ctx.font="bold 30px 'Comic Sans MS'"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("🗺️ Tap a place to go there",CENTER,80);
        for(const r of placeRects){ ctx.fillStyle=r.b.type.col; roundRect(r.x,r.y,r.w,r.h,12); ctx.fill(); ctx.fillStyle="#4A2E17"; ctx.font="bold 20px 'Comic Sans MS'"; ctx.textAlign="left"; ctx.fillText(r.b.type.e+" "+r.b.name+" "+(r.b.side<0?"(left)":"(right)"),r.x+16,r.y+r.h/2); } } }
  }
  let last=performance.now();
  function loop(now){ let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05; update(dt); render(); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();
</script>
</body>
